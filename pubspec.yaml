name: flit
description: "A Flutter development workspace for Android."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  xterm:
    path: third_party/xterm
  flutter_pty: ^0.4.2
  webview_flutter: ^4.10.0
  permission_handler: ^12.0.0

  flit_env:
    path: plugins/flit_env
  flit_lsp:
    path: plugins/flit_lsp
  flit_device:
    path: plugins/flit_device
  flit_work:
    path: plugins/flit_work
  flit_files:
    path: plugins/flit_files
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  webview_flutter_platform_interface: ^2.15.1

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf

  assets:
    - assets/toolchain_manifest.json
    - assets/scripts/lib.sh
    - assets/scripts/check.sh
    - assets/scripts/android_jdk.sh
    - assets/scripts/android_sdk.sh
    - assets/scripts/android_ndk.sh
    - assets/scripts/android_gradle.sh
    - assets/scripts/flutter_sdk.sh
    - assets/scripts/flutter_tools.sh
    - assets/scripts/flutter_warmup.sh
    - assets/scripts/net_probe.sh
