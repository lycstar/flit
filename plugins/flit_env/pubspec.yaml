name: flit_env
description: Termux 运行环境原生桥：bootstrap 部署与状态、一次性 exec、文件 sha256、系统代理跟随、系统页/浏览器跳转。
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: cc.lycstar.flit.env
        pluginClass: FlitEnvPlugin
