name: flit_device
description: 本机调试设备原生桥：无线调试端口 NSD 发现（本机过滤）、电池优化状态与申请。
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: cc.lycstar.flit.device
        pluginClass: FlitDevicePlugin
